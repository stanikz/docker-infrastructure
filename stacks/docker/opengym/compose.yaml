x-backrest-labels: &backrest-labels
  backrest.backup: "true"
  backrest.priority: "high"
  backrest.action: "stop"

services:
  api:
    image: ghcr.io/duartesantos8/opengym-api:1.4.0
    container_name: opengym_api
    hostname: opengym-api
    restart: unless-stopped
    networks:
      - internal-net
    env_file:
      - .env
    environment:
      TZ: ${TZ}
      PORT: ${PORT:-3000}
      DATA_DIR: /data
      TRUST_PROXY: ${TRUST_PROXY:-1}
    volumes:
      - ${DOCKER_DATA}/opengym/app/data:/data
      - ${DOCKER_DATA}/opengym/app/coach-auth:/coach-auth
      - /etc/localtime:/etc/localtime:ro
    labels:
      <<: *backrest-labels
      backrest.priority: "critical"
      backrest.wait-time: "30"

  web:
    image: ghcr.io/duartesantos8/opengym-web:1.4.0
    container_name: opengym
    hostname: opengym
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:${NGINX_PORT:-80}"
    networks:
      - internal-net
      - proxy-network
    env_file:
      - .env
    environment:
      TZ: ${TZ}
      NGINX_PORT: ${NGINX_PORT:-80}
      BACKEND: ${BACKEND:-api}
      PORT: ${PORT:-3000}
      RESOLVER: ${RESOLVER:-127.0.0.11}
      CF_CONNECTING_IP: ${CF_CONNECTING_IP:-}
      BASE_PATH: ${BASE_PATH:-}
      MEDIA_UPLOAD_MAX: ${MEDIA_UPLOAD_MAX:-48m}
    volumes:
      - /etc/localtime:/etc/localtime:ro

networks:
  proxy-network:
    name: ${EXTERNAL_NETWORK_NAME:-proxy-network}
    external: true

  internal-net:
    name: opengym-net
    driver: bridge